<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-wrapper">
    <form id="loginForm" class="login-card" novalidate>
      <h2>Sign in</h2>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <div class="pw-row">
        <input id="password" name="password" type="password" placeholder="Password" required>
        <button type="button" id="togglePw" class="pw-toggle" aria-label="Show password">Show</button>
      </div>
      <label class="checkbox"><input type="checkbox" id="remember"> Remember me</label>
      <button type="submit" class="btn">Log in</button>
      <p class="small">Don't have an account? <a href="home.html">Home</a></p>
    </form>
  </main>
  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const pw = document.getElementById('password');
      const toggle = document.getElementById('togglePw');
      toggle.addEventListener('click', ()=> {
        if (pw.type === 'password') { pw.type = 'text'; toggle.textContent = 'Hide'; }
        else { pw.type = 'password'; toggle.textContent = 'Show'; }
      });
      form.addEventListener('submit', function(e){
        e.preventDefault();
        const eVal = email.value.trim();
        const pVal = pw.value;
        if (!eVal || !pVal) {
          alert('Please enter email and password.');
          return;
        }
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!re.test(eVal)) { alert('Please enter a valid email.'); return; }
        alert('Login successful (demo).'); 
        form.reset();
      });
    })();
  </script>
</body>
</html>
